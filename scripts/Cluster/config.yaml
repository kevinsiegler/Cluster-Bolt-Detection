project:
  name: "Bolt_Cluster_Completion"
  version: "1.0"

paths:
  # Input Directories
  train_labels: "C:\\Users\\Kevin\\Clustererkennung\\bolt_detection\\dataset\\all_labels"
  val_labels: "C:/Users/Kevin/Clustererkennung/bolt_detection/dataset/labels/val"
  # Input directory for inference run
  inference_input_dir: "C:/Users/Kevin/Clustererkennung/bolt_detection/scripts/YOLO/testing/infer_train_30_epochs_m_conf(0.4)/labels"
  # Output Directories (Scripts will create subfolders here)
  output_root: "C:/Users/Kevin/Clustererkennung/bolt_detection/scripts/Cluster/Outputs"
  # Where to save/load the learned prototypes
  model_dir: "models"

preprocessing:
  # Normalize coordinates to [0,1] based on image size (assumed 1.0 if normalized YOLO)
  use_normalized_coords: true

clustering:
  # Name of the model file to save/load (without .pkl extension)
  model_name: "all_cluster"
  # Feature-based clustering is faster than pairwise point-set distance for 6500 images
  n_clusters: -1  # Set to -1 to use ALL training samples as prototypes (1:1 replica).
  random_state: 42
  # After clustering, remove prototypes that are too similar to others (distance < threshold)
  pruning_threshold: 0

inference:
  # Name of the current run (used for output folder naming)
  run_name: "YOLO_run7_all_with_penalties"
  # Strict threshold for 1:1 matching. Increased to 0.015 (~1.5%) to handle YOLO jitter better.
  strict_spatial_threshold: 0.015
  # Threshold to consider a point an "inlier" for robust scoring (normalized coordinates 0.0-1.0)
  inlier_threshold: 0.04
  # Score to accept a prototype match. Increased to 5.0 to almost ALWAYS accept the best match found.
  # This prevents "nothing set" when the cluster is visually correct but has some outliers.
  acceptance_threshold: 100
  # Penalty for each predicted missing bolt (Occam's Razor).
  missing_penalty: 20
  # Penalty for each outlier (input point not matching cluster).
  outlier_penalty: 1.0
  # Maximum allowed shift of a prototype to fit input points (normalized coordinates).
  # A value of 0.03 is roughly one bounding box size.
  max_translation: 0.03
  # If true, aligns prototype to input using Translation + Scale. If false, Translation only.
  allow_scaling: false
  # If true, removes input points that do not match the selected prototype.
  filter_input_points: false
  # Default size for predicted boxes (width, height)
  default_box_size: [0.014, 0.025]

evaluation:
  # Distance threshold for True Positive (normalized)
  dist_threshold: 0.05
  # IoU threshold for True Positive
  iou_threshold: 0.3
